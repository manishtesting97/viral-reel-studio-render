name: VRS Hybrid Production
run-name: VRS Production ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: {type: string, required: true}
      expected_sha: {type: string, required: true}
      runner:
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted
        required: false
      probe: {type: boolean, default: false}
permissions:
  contents: read
concurrency:
  group: vrs-hybrid-production
  cancel-in-progress: false
jobs:
  render:
    name: Isolated production · setup through private delivery
    if: >-
      github.repository == 'manishtesting97/viral-reel-studio-render' &&
      !github.event.repository.private && github.ref == 'refs/heads/main' &&
      github.sha == inputs.expected_sha &&
      (inputs.probe ||
       inputs.runner == 'self-hosted' ||
       vars.VRS_HYBRID_WORKLOAD == 'software-project' ||
       vars.VRS_HYBRID_WORKLOAD == 'agreement-covered' ||
       startsWith(vars.VRS_HYBRID_WORKLOAD, 'software-project:') ||
       startsWith(vars.VRS_HYBRID_WORKLOAD, 'agreement-covered:'))
    environment: vrs-hybrid-production
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","Linux","X64"]') || fromJSON('["ubuntu-22.04"]') }}
    timeout-minutes: 30
    steps:
      - name: 01 · Environment and security · refuse debug logging
        env:
          DEBUG: ${{ runner.debug }}
        run: test "$DEBUG" != 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Supply FFmpeg if absent from the runner image
        run: |
          if command -v ffmpeg && command -v ffprobe; then exit 0; fi
          archive="$RUNNER_TEMP/vrs-ffmpeg.tar.xz"
          curl --fail --silent --show-error --location --max-time 75 \
            https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz \
            --output "$archive"
          printf '%s  %s\n' 41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380 "$archive" | sha256sum --check -
          tools="$RUNNER_TEMP/vrs-tools"
          mkdir "$tools"
          tar --extract --xz --file "$archive" --directory "$tools" --strip-components=2 \
            --no-same-owner --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          test -x "$tools/ffmpeg" && test -x "$tools/ffprobe"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"
      - name: Install pinned renderer prerequisites
        run: |
          source /etc/os-release
          if [ "${{ inputs.runner }}" = "self-hosted" ]; then
            test "$(uname -s):$(dpkg --print-architecture)" = Linux:amd64
            if ! command -v bwrap >/dev/null 2>&1; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends bubblewrap
            fi
          else
            test "$ID:$VERSION_ID:$(dpkg --print-architecture)" = ubuntu:22.04:amd64
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends bubblewrap=0.6.1-1ubuntu0.3
          fi
          bwrap --version
          node --version
          python3 --version
          gh --version
          npm --prefix engine ci --no-audit --no-fund
          test -x /opt/google/chrome/chrome || command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          ffprobe -version
          ffmpeg -hide_banner -filters | grep -w ass
          ffmpeg -hide_banner -encoders | grep -w libx264
          ffmpeg -hide_banner -encoders | grep -w aac
          printf 'VRS_JOB=%s/vrs-hybrid-job\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify offline namespace and sandboxed Chrome without media
        run: |
          umask 077
          preflight=$(mktemp -d "$RUNNER_TEMP/vrs-prerequisites.XXXXXX")
          trap 'rm -rf -- "$preflight"' EXIT
          touch "$preflight/transfer.json"
          VRS_JOB="$preflight" bash engine/github_render_sandbox.sh probe
      - name: Install pinned Python prerequisites
        if: ${{ !inputs.probe }}
        run: |
          umask 077
          python3 -m pip install --no-cache-dir -r installers/python.lock.txt
      - name: 01 · Verify private draft metadata before downloading media
        id: metadata
        if: ${{ !inputs.probe }}
        env:
          GH_TOKEN: ${{ secrets.VRS_PRIVATE_TRANSFER_TOKEN }}
          REQUEST: ${{ inputs.request_id }}
        run: |
          umask 077
          python3 engine/github_production.py metadata "$VRS_JOB" "$REQUEST" >> "$GITHUB_OUTPUT"
      - name: 02 · Prepare pinned Faster Whisper runtime
        if: ${{ steps.metadata.outputs.operation == 'transcribe' || steps.metadata.outputs.operation == 'produce' }}
        run: |
          umask 077
          models="$RUNNER_TEMP/vrs-models"
          mkdir -p "$models"
          python3 engine/github_model_setup.py "$models" base
          printf 'VRS_MODEL_DIR=%s\n' "$models" >> "$GITHUB_ENV"
      - name: Prepare offline Apex and Stable-ts for eligible narration before private fetch
        if: ${{ steps.metadata.outputs.recovery == 'true' || steps.metadata.outputs.apex_eligible == 'true' }}
        run: |
          umask 077
          python3 engine/github_model_setup.py "$VRS_MODEL_DIR" apex
      - name: 01 · Retrieve and verify private inputs after prerequisites
        if: ${{ !inputs.probe }}
        env:
          GH_TOKEN: ${{ secrets.VRS_PRIVATE_TRANSFER_TOKEN }}
          REQUEST: ${{ inputs.request_id }}
          OPERATION: ${{ steps.metadata.outputs.operation }}
          RECOVERY: ${{ steps.metadata.outputs.recovery }}
          APEX_ELIGIBLE: ${{ steps.metadata.outputs.apex_eligible || 'false' }}
        run: |
          umask 077
          python3 engine/github_production.py fetch "$VRS_JOB" "$REQUEST" "$OPERATION" "$RECOVERY" "$APEX_ELIGIBLE" >/dev/null 2>&1 ||
            { echo 'Private input verification failed'; exit 1; }
      - name: 02 · Whisper transcription and optional Apex and stable-ts recovery
        id: transcribe
        if: ${{ steps.metadata.outputs.operation == 'transcribe' }}
        run: |
          umask 077
          bash engine/github_render_sandbox.sh >/dev/null 2>&1 ||
            { echo 'Isolated transcribe failed'; exit 1; }
      - name: 03–04 · Verify aligned captions, prepare 3D assets, compose scenes and brand CTA
        id: prepare
        if: ${{ steps.metadata.outputs.operation == 'prepare' }}
        run: |
          umask 077
          bash engine/github_render_sandbox.sh >/dev/null 2>&1 ||
            { echo 'Isolated prepare failed'; exit 1; }
      - name: 05–06 · HyperFrames capture, FFmpeg encoding, output verification and CapCut exports
        id: capture
        if: ${{ steps.metadata.outputs.operation == 'render' }}
        run: |
          umask 077
          bash engine/github_render_sandbox.sh >/dev/null 2>&1 ||
            { echo 'Isolated render failed'; exit 1; }
      - name: 02 · Recognize narration with Faster Whisper and align captions
        id: speech
        if: ${{ steps.metadata.outputs.operation == 'produce' }}
        run: |
          umask 077
          bash engine/github_render_sandbox.sh speech >/dev/null 2>&1 ||
            { echo 'Isolated recognition and alignment failed'; exit 1; }
          if test -f "$VRS_JOB/needs-apex" && test ! -L "$VRS_JOB/needs-apex"; then
            echo 'apex=true' >> "$GITHUB_OUTPUT"
          fi
      - name: 03 · Recover and align caption timings
        id: recovery
        if: ${{ steps.speech.outputs.apex == 'true' }}
        continue-on-error: true
        run: |
          umask 077
          bash engine/github_render_sandbox.sh recovery >/dev/null 2>&1 ||
            { echo 'Isolated caption recovery failed'; exit 1; }
      - name: 05 · Generate assets and compose narration-driven motion graphics
        id: compose
        if: ${{ steps.metadata.outputs.operation == 'produce' && steps.speech.outcome == 'success' }}
        continue-on-error: true
        run: |
          umask 077
          bash engine/github_render_sandbox.sh compose >/dev/null 2>&1 ||
            { echo 'Isolated composition failed; retaining caption checkpoint'; exit 1; }
      - name: 06 · Capture with HyperFrames, encode with FFmpeg and verify CapCut media
        id: production_capture
        if: ${{ steps.compose.outcome == 'success' }}
        continue-on-error: true
        run: |
          umask 077
          bash engine/github_render_sandbox.sh capture >/dev/null 2>&1 ||
            { echo 'Isolated capture failed; retaining composition checkpoint'; exit 1; }
      - name: 07 · Transfer verified output to private storage
        id: delivery
        if: ${{ !inputs.probe }}
        env:
          GH_TOKEN: ${{ secrets.VRS_PRIVATE_TRANSFER_TOKEN }}
        run: |
          umask 077
          python3 engine/github_production.py upload "$VRS_JOB" >/dev/null 2>&1 ||
            { echo 'Private output transfer failed'; exit 1; }
      - name: Verify restricted private transfer without media
        if: inputs.probe
        env:
          GH_TOKEN: ${{ secrets.VRS_PRIVATE_TRANSFER_TOKEN }}
        run: |
          umask 077
          mkdir "$VRS_JOB"
          python3 engine/github_production.py probe "$VRS_JOB" >/dev/null 2>&1 ||
            { echo 'Restricted transfer check failed'; exit 1; }
      - name: Summarize completed work without private content
        if: ${{ always() && !inputs.probe }}
        env:
          RUNNER_MODE: ${{ inputs.runner || 'github-hosted' }}
          TRANSCRIBE: ${{ steps.transcribe.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
          DELIVERY: ${{ steps.delivery.outcome }}
          SPEECH: ${{ steps.speech.outcome }}
          RECOVERY_PHASE: ${{ steps.recovery.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          PRODUCTION_CAPTURE: ${{ steps.production_capture.outcome }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          delivery = Path(os.environ.get("VRS_JOB", "/nonexistent")) / "delivery"
          print(f"- Runner mode: `{os.environ.get('RUNNER_MODE', 'github-hosted')}`")
          for key, title in [
              ("TRANSCRIBE", "02 · Speech recognition and recovery"),
              ("PREPARE", "03–04 · Caption readiness, assets, composition and branding"),
              ("CAPTURE", "05–06 · Video capture, encoding and verified companion files"),
              ("SPEECH", "02 · Faster Whisper and alignment"),
              ("RECOVERY_PHASE", "03 · Conditional Apex recovery"),
              ("COMPOSE", "05 · Asset generation, composition and motion"),
              ("PRODUCTION_CAPTURE", "06 · Capture, encoding and CapCut media"),
              ("DELIVERY", "07 · Private output transfer"),
          ]:
              status = os.environ.get(key)
              if status in {"success", "failure", "cancelled", "skipped"}:
                  print(f"- {title}: **{status}**")
          state = delivery / "state.json"
          if state.is_file():
              status = json.loads(state.read_text()).get("status")
              if status in {"complete","caption-review","scene-review","aligned","composed","recovery"}:
                  print(f"- Automatic production result: **{status}**")
          for operation, keys in {
              "transcribe": ("transcribeSeconds", "wordCount"),
              "prepare": ("prepareSeconds", "modelsRequired", "modelsPrepared", "modelsReused"),
              "render": ("captureSeconds", "encodingSeconds", "duration", "frames", "cpus"),
          }.items():
              path = delivery / f"{operation}-metrics.json"
              if not path.is_file():
                  continue
              metrics = json.loads(path.read_text())
              model = metrics.get("model")
              if model in {"tiny.en", "small", "apex-ct2-int8"}:
                  print(f"- Transcription model: {model}. Caption acceptance is checked by the dashboard.")
              for key in keys:
                  if type(metrics.get(key)) in {float, int}:
                      print(f"- {key}: {metrics[key]}")
          EOF
      - name: 07 · Remove runner media and verify cleanup
        if: always()
        run: |
          if test -n "${VRS_JOB:-}"; then
            rm -rf -- "$VRS_JOB"
            test ! -e "$VRS_JOB"
          fi
          rm -rf -- "$RUNNER_TEMP/vrs-models" "$RUNNER_TEMP/vrs-apex-hf"
          test ! -e "$RUNNER_TEMP/vrs-models" && test ! -e "$RUNNER_TEMP/vrs-apex-hf"
          echo '- Runner scratch and model files removed.' >> "$GITHUB_STEP_SUMMARY"
